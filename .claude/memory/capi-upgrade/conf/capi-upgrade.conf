UPSTREAM_URL=https://github.com/kubernetes-sigs/cluster-api-provider-vsphere.git
PROVIDER=capv
SPECTRO_SRC=origin/spectro-master
# NOTE: quote any value containing '|' or spaces — this file is `.`-sourced, so an unquoted
# pattern list is parsed as a command pipeline (MANDATORY_PATTERNS collapsed to "Added").
MANDATORY_PATTERNS="Added Spectro Manifests|exclusive webhook|Spectro CICD|self hosted runner|RBAC|ServiceAccount"
GENERATED_PATHS="config/|spectro/base|spectro/global|zz_generated"
# F4_HOTSPOTS: populate on first triage (per-repo; empty is safe — unknowns route to NEEDS-DECISION)
F4_HOTSPOTS=
# --- integration/validation tail (Spec Patch) ---
CLOUD=vsphere
CBT_FEATURE=lifecycle   # ally/tests/cbt go-test suite (NOT make cbt-<cloud>); select per cloud
VENDORCRD=config/vendorcrd/vsphere     # confirm exact config/vendorcrd/<dir>
BUILD_VARS_ENABLED=1
BUILD_VARS_MAKEFILE=Makefile
# P3c bumps the vX.Y.Z token after this key, preserving any suffix. `TAG ?= dev` carries no version
# and the anchored ^TAG cannot match `DEV_TAG`, so TAG made P3c a complete no-op here — a v1.16.1
# build kept publishing as v1.12.0-spectro-${SPECTRO_VERSION} (Makefile:280, used at :1143/1146/1153
# via `make docker-build` from the release workflow), colliding with genuine v1.12.0 images and
# feeding that tag to palette's overlay pin and CBT. DEV_TAG is the version-bearing key.
BUILD_VARS_TAG_KEY=DEV_TAG
BUILD_VARS_GO_KEY=BUILDER_GOLANG_VERSION
